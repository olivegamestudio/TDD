name: Build and Test

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Update apt cache
      run: apt-get update

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore tools
      run: dotnet tool restore

    - name: Build
      run: dotnet build OliveGameStudio.slnx

    - name: Test
      run: dotnet test OliveGameStudio.slnx --no-build --verbosity normal
