# Build and test every push to main and every pull request, so a red change is visible before
# anyone reviews it rather than after it has landed. Until this existed nothing in this repository
# had ever been compiled by anything but the author's own machine (#34).
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer stale, so cancel it rather than
# paying for an answer about a commit nobody will merge. `main` is exempt: its runs are the record
# of what the branch did, and cancelling one would leave a commit with no result at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The build is the product here, not a developer's working copy, so a restore that has to reach
  # the network is a failure worth seeing rather than a delay worth hiding.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # MonoGame's content pipeline runs `mgcb` as a local tool pinned in
      # BattleForce2249.MonoGame/.config/dotnet-tools.json. MonoGame.Content.Builder.Task restores
      # it as part of the build, but doing it here first means a tooling failure is reported as a
      # tooling failure instead of as a mysterious content-build error several minutes later.
      - name: Restore MonoGame content tooling
        working-directory: BattleForce2249.MonoGame
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore OliveGameStudio.slnx

      - name: Build
        run: dotnet build OliveGameStudio.slnx --configuration Release --no-restore

      # --no-build so the tests run against exactly the binaries the step above produced, rather
      # than quietly rebuilding and testing something the build step never saw.
      - name: Test
        run: dotnet test OliveGameStudio.slnx --configuration Release --no-build --verbosity normal
